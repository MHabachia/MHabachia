name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Läuft einmal täglich um Mitternacht
  workflow_dispatch:      # Erlaubt das manuelle Starten per Klick
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generiert die Snake-SVG-Datei
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Lädt die generierten GIFs/SVGs in dein Repository hoch
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
